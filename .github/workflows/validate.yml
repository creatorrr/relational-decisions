name: Validate benchmark

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r benchmarks/nl_logic_v1/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/nl_logic_v1/validate.py --problog
      - run: rd-bench --backend oracle --split dev --output runs/ci-oracle-dev
